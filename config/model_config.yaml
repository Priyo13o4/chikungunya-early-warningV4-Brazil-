random_seed: 42

compute_backend:
  # mode: auto|cpu|macos_metal|nvidia_cuda
  mode: auto
  # prefer_gpu_for: baselines|bayesian|both
  prefer_gpu_for: both
  fallback: cpu

baseline_models:
  - rule_based_threshold
  - logistic_regression
  - poisson_regression
  - random_forest
  - xgboost
bayesian_model:
  name: hierarchical_poisson
  climate_covariates:
    - month_sin
    - month_cos
    - rainfall
    - temperature
    - humidity
  # sampling_backend: auto|pymc|jax_numpyro
  sampling_backend: auto
  draws: 4000
  tune: 4000
  chains: 6
  bayesian_progress: true
  target_accept: 0.95
  max_treedepth: 12
  force_full_bayesian: false
  # Optional: strict|warn. If omitted, strict applies only in strict/full runs;
  # low-sample smoke settings (chains < 2 or draws < 50) auto-downgrade to warn.
  # convergence_failure_mode: strict
  bayesian_simplified_mode: false
  max_convergence_retries: 1
  oof_execution_mode: conditional
  oof_conditional_rhat_threshold: 1.05
  oof_conditional_ess_threshold: 200.0
  oof_conditional_divergence_threshold: 25
  divergence_warn_threshold: 25
  rhat_warn_threshold: 1.05
  ess_warn_threshold: 200.0
  grouped_temporal_ess_fail_fraction_threshold: 0.20
  grouped_temporal_rhat_fail_fraction_threshold: 0.20
  outbreak_threshold_default_cases: 1.0
  posterior_sample_cap: 500
  predictive_chunk_rows: 4000

bayesian_model_profiles:
  cv:
    chains: 6
    tune: 3000
    draws: 3000
    target_accept: 0.95
    max_treedepth: 12
    bayesian_progress: false
  final:
    chains: 6
    tune: 4000
    draws: 4000
    target_accept: 0.95
    max_treedepth: 12
    bayesian_progress: true
  dev:
    chains: 1
    tune: 200
    draws: 150
    target_accept: 0.9
    max_treedepth: 10
    bayesian_progress: false

memory_optimization:
  mode: off
  train_year_window: null
  district_shard_count: null
  district_shard_index: null
  bayesian_subset:
    enabled: false
    max_rows: 0
    strategy: recent_years

decision:
  policy_version: v1
  optimize_threshold: true
  optimization_risk_basis: bayesian_oof_risk_mean
  optimization_min_samples: 100
  optimization_grid_size: 101
  optimization_grid_min: 0.0
  optimization_grid_max: 1.0
  risk_score_basis: bayesian_oof_risk_mean
  alert_thresholds:
    yellow: 0.3
    orange: 0.5
    red: 0.7
